<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX - Insights & Blogs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        /* NAVBAR */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 60px;
            background-color: #0a0a0a;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #cccccc;
            font-size: 16px;
            font-weight: 400;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .btn-get-started {
            background-color: #1e1e1e;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-get-started:hover {
            background-color: #2a2a2a;
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 60px 60px 40px;
        }

        .hero h1 {
            font-size: clamp(80px, 10vw, 130px);
            font-weight: 900;
            line-height: 1.0;
            color: #ffffff;
            letter-spacing: -2px;
        }

        /* FILTER BUTTONS */
        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 30px 0 50px;
        }

        .filter-btn {
            padding: 12px 28px;
            border-radius: 50px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: #e8520a;
            color: #ffffff;
        }

        .filter-btn:not(.active) {
            background-color: #1e1e1e;
            color: #cccccc;
        }

        .filter-btn:not(.active):hover {
            background-color: #2a2a2a;
            color: #ffffff;
        }

        /* BLOG CARDS SECTION */
        .blog-section {
            padding: 0 60px 80px;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CARD */
        .card {
            background-color: #111111;
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            border-radius: 14px;
        }

        .card-body {
            padding: 20px 20px 28px;
        }

        .card-tag {
            display: inline-block;
            background-color: #5a2a00;
            color: #e8520a;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
            margin-bottom: 14px;
        }

        .card-date {
            font-size: 14px;
            color: #666666;
            font-weight: 400;
        }

        /* SVG Logo Icon */
        .logo-svg {
            display: flex;
            align-items: center;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .blog-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            nav {
                padding: 20px 30px;
            }

            .hero {
                padding: 40px 30px 30px;
            }

            .blog-section {
                padding: 0 30px 60px;
            }
        }

        @media (max-width: 600px) {
            .blog-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }

            .hero h1 {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <a href="#" class="logo">
            <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 28L20 8L32 28" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 20L26 20" stroke="white" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <span class="logo-text">ScaleX</span>
        </a>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Blogs</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>

        <button class="btn-get-started">Get Started</button>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <h1>Insights & Blogs</h1>
    </section>

    <!-- FILTER BUTTONS -->
    <div class="filter-buttons">
        <button class="filter-btn active">All</button>
        <button class="filter-btn">Tech</button>
        <button class="filter-btn">SaaS</button>
        <button class="filter-btn">Marketing</button>
    </div>

    <!-- BLOG CARDS -->
    <section class="blog-section">
        <div class="blog-grid">

            <!-- Card 1 -->
            <div class="card">
                <img
                    class="card-image"
                    src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=600&auto=format&fit=crop"
                    alt="Martini glass on red background"
                />
                <div class="card-body">
                    <span class="card-tag">Tech</span>
                    <h2 class="card-title">The Ultimate Guide To SaaS Marketing</h2>
                    <p class="card-date">May 23, 2025</p>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <img
                    class="card-image"
                    src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600&auto=format&fit=crop"
                    alt="Chair on orange background"
                />
                <div class="card-body">
                    <span class="card-tag">SaaS</span>
                    <h2 class="card-title">5 Key Trends In SaaS Growth For 2025</h2>
                    <p class="card-date">May 23, 2025</p>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <img
                    class="card-image"
                    src="https://images.unsplash.com/photo-1574144611937-0df059b5ef3e?w=600&auto=format&fit=crop"
                    alt="Cat looking up on red background"
                />
                <div class="card-body">
                    <span class="card-tag">Marketing</span>
                    <h2 class="card-title">How Data-Driven Strategies Are Important</h2>
                    <p class="card-date">May 23, 2025</p>
                </div>
            </div>

        </div>
    </section>

    <!-- FILTER SCRIPT -->
    <script>
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>

</body>
</html>
